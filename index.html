<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <link
            rel="icon"
            href="assets/navbar-icons/icon.png"
        >
        <link
            rel="stylesheet"
            href="css/reset.css"
        >
        <link
            rel="stylesheet"
            href="css/variables.css"
        >
        <link
            rel="stylesheet"
            href="css/main.css"
        >

        <script src="./javascript/index.js" defer></script>

        <title>Instagram Navbar</title>
    </head>
    <body>
        <main class="main">
            <div class="main__logo">
                <img
                    class="main__mobile-image"
                    src="assets/responsive-images/miro-mobile.png"
                    alt="Logo principal"
                >
                <img
                    class="main__tablet-image"
                    src="assets/responsive-images/miro-tablet.png"
                    alt="Logo principal"
                >
                <img
                    class="main__desktop-image"
                    src="assets/responsive-images/miro-desktop.png"
                    alt="Logo principal"
                >
            </div>
        </main>
        <nav class="navbar">
            <div class="navbar__brand">
                <img
                    class="navbar__logo"
                    src="assets/navbar-icons/black-logo.png"
                    alt="instagram logo"
                >
                <img
                    data-text
                    class="navbar__isotype navbar__text--hidden"
                    src="assets/navbar-icons/black-isotype.png"
                    alt="instagram isotype"
                >
            </div>
            <div class="navbar__container">
                <a
                    class="navbar__item"
                    href="#"
                    aria-label="Inicio"
                >
                    <img
                        class="navbar__icon"
                        src="assets/navbar-icons/black-home.png"
                        alt="home"
                    >
                    <span data-text class="navbar__text navbar__text--hidden">Inicio</span>
                </a>
                <a
                    class="navbar__item navbar__item--hidden"
                    href="#"
                    aria-label="Búsqueda"
                >
                    <img
                        class="navbar__icon"
                        src="assets/navbar-icons/black-search.png"
                        alt="search"
                    >
                    <span data-text class="navbar__text navbar__text--hidden">Búsqueda</span>
                </a>
                <a
                    class="navbar__item"
                    href="#"
                    aria-label="Explorar"
                >
                    <img
                        class="navbar__icon"
                        src="assets/navbar-icons/black-compass.png"
                        alt="explore"
                    >
                    <span data-text class="navbar__text navbar__text--hidden">Explorar</span>
                </a>
                <a
                    class="navbar__item"
                    href="#"
                    aria-label="Reels"
                >
                    <img
                        class="navbar__icon"
                        src="assets/navbar-icons/black-video.png"
                        alt="reels"
                    >
                    <span data-text class="navbar__text navbar__text--hidden">Reels</span>
                </a>
                <a
                    class="navbar__item"
                    href="#"
                    aria-label="Mensajes"
                >
                    <img
                        class="navbar__icon"
                        src="assets/navbar-icons/black-send.png"
                        alt="messages"
                    >
                    <span data-text class="navbar__text navbar__text--hidden">Mensajes</span>
                </a>
                <a
                    class="navbar__item navbar__item--hidden"
                    href="#"
                    aria-label="Notificaciones"
                >
                    <img
                        class="navbar__icon"
                        src="assets/navbar-icons/black-heart.png"
                        alt="notifications"
                    >
                    <span data-text class="navbar__text navbar__text--hidden">Notificaciones</span>
                </a>
                <a
                    class="navbar__item"
                    href="#"
                    aria-label="Crear"
                >
                    <img
                        class="navbar__icon"
                        src="assets/navbar-icons/black-add.png"
                        alt="create"
                    >
                    <span data-text class="navbar__text navbar__text--hidden">Crear</span>
                </a>
                <a
                    class="navbar__item"
                    href="#"
                    aria-label="Perfil"
                >
                    <img
                        class="navbar__icon perfil"
                        src="assets/navbar-icons/miro-profile.png"
                        alt="perfil"
                    >
                    <span data-text class="navbar__text navbar__text--hidden">Perfil</span>
                </a>
            </div>
            <div class="navbar__more">
                <img
                    data-navbar-toggle
                    data-menu-status="inactive"
                    class="navbar__menu-icon"
                    src="assets/navbar-icons/black-menu.png"
                    alt="menu"
                    aria-label="Abrir o cerrar menú"
                    role="button"
                    tabindex="0"
                >
            </div>
        </nav>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <link
            rel="icon"
            href="assets/icon.png"
        >
        <link
            rel="stylesheet"
            href="css/reset.css"
        >
        <link
            rel="stylesheet"
            href="css/variables.css"
        >
        <link
            rel="stylesheet"
            href="css/main.css"
        >

        <title>Instagram Navbar</title>
    </head>
    <body>
        <nav class="navbar">
            <div class="navbar__brand">
                <img
                    class="navbar__logo"
                    src="assets/white-logo.png"
                    alt="instagram logo"
                >
                <img
                    class="navbar__isotype"
                    src="assets/white-isotype.png"
                    alt="instagram isotype"
                >
            </div>
            <div class="navbar__container">
                <a
                    class="navbar__item"
                    href="#"
                >
                    <img
                        class="navbar__icon"
                        src="assets/white-home.png"
                        alt="home"
                    >
                    <span class="navbar__text navbar__text--hidden">Inicio</span>
                </a>
                <a
                    class="navbar__item navbar__item--hidden"
                    href="#"
                >
                    <img
                        class="navbar__icon"
                        src="assets/white-search.png"
                        alt="search"
                    >
                    <span class="navbar__text navbar__text--hidden">Búsqueda</span>
                </a>
                <a
                    class="navbar__item"
                    href="#"
                >
                    <img
                        class="navbar__icon"
                        src="assets/white-compass.png"
                        alt="explore"
                    >
                    <span class="navbar__text navbar__text--hidden">Explorar</span>
                </a>
                <a
                    class="navbar__item"
                    href="#"
                >
                    <img
                        class="navbar__icon"
                        src="assets/white-video.png"
                        alt="reels"
                    >
                    <span class="navbar__text navbar__text--hidden">Reels</span>
                </a>
                <a
                    class="navbar__item"
                    href="#"
                >
                    <img
                        class="navbar__icon"
                        src="assets/white-send.png"
                        alt="messages"
                    >
                    <span class="navbar__text navbar__text--hidden">Mensajes</span>
                </a>
                <a
                    class="navbar__item navbar__item--hidden"
                    href="#"
                >
                    <img
                        class="navbar__icon"
                        src="assets/white-heart.png"
                        alt="notifications"
                    >
                    <span class="navbar__text navbar__text--hidden">Notificaciones</span>
                </a>
                <a
                    class="navbar__item"
                    href="#"
                >
                    <img
                        class="navbar__icon"
                        src="assets/white-add.png"
                        alt="create"
                    >
                    <span class="navbar__text navbar__text--hidden">Crear</span>
                </a>
                <a
                    class="navbar__item"
                    href="#"
                >
                    <img
                        class="navbar__icon perfil"
                        src="assets/foto.jpg"
                        alt="perfil"
                    >
                    <span class="navbar__text navbar__text--hidden">Perfil</span>
                </a>
            </div>
            <div class="navbar__more">
                <img
                    class="navbar__menu-icon"
                    src="assets/white-menu.png"
                    alt="menu"
                >
            </div>
        </nav>
    </body>
</html>
